name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          MONGO_URL: mongodb://localhost:27017
          JWT_SECRET_KEY: ci-test-secret
          DB_NAME: cashflo_ci
        run: |
          set +e
          python -m pytest -q --tb=line -rfEs tests > pytest.txt 2>&1
          status=$?
          cat pytest.txt
          echo "::notice title=pytest::$(tail -n 1 pytest.txt)"
          grep -E "^(FAILED|ERROR)|Error:|assert " pytest.txt | head -25 | while IFS= read -r line; do echo "::error title=pytest::$line"; done
          exit $status

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages (refresh yarn.lock when package.json changed)
        run: |
          if ! yarn install --frozen-lockfile --non-interactive; then
            yarn install --non-interactive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "Aktualizacja yarn.lock [skip ci]"
            git pull --rebase
            git push
          fi
      - name: Type check
        run: |
          set +e
          npx tsc --noEmit --pretty false > tsc.txt 2>&1
          status=$?
          cat tsc.txt
          echo "::notice title=tsc::$(grep -c 'error TS' tsc.txt) errors"
          grep "error TS" tsc.txt | head -40 | while IFS= read -r line; do echo "::error title=tsc::$line"; done
          exit $status
      - name: Bundle for Android
        run: |
          set +e
          npx expo export --platform android --output-dir /tmp/expo-export > export.txt 2>&1
          status=$?
          cat export.txt
          if [ $status -ne 0 ]; then tail -n 15 export.txt | while IFS= read -r line; do echo "::error title=expo export::$line"; done; fi
          exit $status
